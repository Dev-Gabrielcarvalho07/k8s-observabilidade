spring.application.name=tarefas-app
server.port=8080

# Conexao com o banco: valores vem das variaveis de ambiente definidas no Kubernetes
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tarefas}
spring.datasource.username=${DB_USER:tarefas}
spring.datasource.password=${DB_PASSWORD:tarefas}

# Cria a tabela automaticamente na subida (schema.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Actuator: health (probes do Kubernetes) e prometheus (metricas)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
