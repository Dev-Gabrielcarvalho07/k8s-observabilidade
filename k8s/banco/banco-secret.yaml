# Credenciais do PostgreSQL.
# Obs.: Secret do Kubernetes e apenas codificado em base64, nao criptografado.
# Em um ambiente real, essas credenciais nao seriam versionadas no Git.
apiVersion: v1
kind: Secret
metadata:
  name: banco-secret
  namespace: app
type: Opaque
stringData:
  POSTGRES_USER: tarefas
  POSTGRES_PASSWORD: tarefas123
  POSTGRES_DB: tarefas
