apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
  labels:
    app: tarefas-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tarefas-app
  template:
    metadata:
      labels:
        app: tarefas-app
    spec:
      containers:
        - name: tarefas-app
          image: tarefas-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: banco-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banco-secret
                  key: POSTGRES_PASSWORD
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=minikube
          # Espera a aplicacao Java subir (pode levar ~1-2 min no notebook)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
